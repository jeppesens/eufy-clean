room_at_point:
  name: Room at point
  description: >-
    Resolve which mapped room sits under a normalized point on the rendered map
    image. Returns { room_id, room_name }; room_id is -1 when no room is there
    (0 is a valid room id on some robots). Used by
    the bundled Eufy Clean card for tap-a-room-on-the-map selection.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    x:
      name: X
      description: Horizontal position as a fraction (0-1) of the rendered map image, from the left edge.
      required: true
      example: 0.42
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box
    y:
      name: Y
      description: Vertical position as a fraction (0-1) of the rendered map image, from the top edge.
      required: true
      example: 0.61
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box

map_load:
  name: Load map
  description: >-
    Switch the active map to another saved multi-map by its cloud map id (novel /
    protobuf devices only; scalar and legacy models have no multi-map). The map and
    its room list switch over immediately. For most uses the "Switch Map" select
    entity is easier — it lists the maps the robot has visited and calls this
    service for you; this raw service is for scripts/automations that know the id.

    NOTE: the robot pose does NOT switch automatically. After loading a map the
    robot's position / coordinate frame stays on the previous map until the vacuum
    RE-LOCALIZES, which only happens once it MOVES. To ground the new map right away,
    follow this with a small movement — the most reliable is a single-room clean
    (vacuum only, quiet, one pass), started from a script/automation or by picking a
    room from the list in the Eufy Clean card. Avoid selecting the room by tapping it
    on the map right after a switch: the coordinate frame hasn't re-grounded yet, so
    map taps (and zone drawing) can resolve to the wrong spot. Once the robot moves
    and re-localizes, the reported position snaps onto the loaded map.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    cloud_mapid:
      name: Cloud map id
      description: >-
        The saved map's id, as reported by the device. The easiest way to find it:
        the "Switch Map" select entity lists each visited map as "Map (ID: <id>)"
        (with the friendly name once seen) — flip each map once in the Eufy app so
        the robot reports it, then read the ids there.
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box
    seq:
      name: Sequence
      description: Optional request sequence number the device echoes back in its acknowledgement. Leave as the default unless you need to correlate the ack.
      required: false
      default: 1
      example: 1
      selector:
        number:
          min: 0
          mode: box

forget_map:
  name: Forget map
  description: >-
    Remove a saved map from the "Switch Map" list. The list is learn-as-seen — the
    integration remembers every map the robot has reported and never drops one, because
    the device gives no authoritative list of its current maps to reconcile against. So
    a map deleted in the app, or wiped by a factory reset, keeps showing in the selector
    forever. Use this to prune it. Local only: nothing is sent to the robot, and the
    map on the device is untouched. The ACTIVE map cannot be forgotten (it would
    immediately re-appear); forgetting an id that isn't in the list does nothing.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    cloud_mapid:
      name: Cloud map id
      description: >-
        The id of the saved map to forget, as shown in the "Switch Map" select entity
        ("Map (ID: <id>)").
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box

remote_drive:
  name: Remote drive
  description: >-
    Drive the robot by hand, like the app's Manual Controls. The command is
    repeated every 500 ms for the duration, then the robot brakes. Start remote
    mode with vacuum.send_command start_remote (and leave it with stop_remote).
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    direction:
      name: Direction
      description: Which way to move; brake stops without leaving remote mode.
      required: true
      example: forward
      selector:
        select:
          options: [forward, back, left, right, brake]
    duration:
      name: Duration
      description: Seconds to keep moving (maximum 10).
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s

set_room_config:
  name: Set room config
  description: >-
    Set a room's persistent per-room cleaning settings — suction power, wash
    (mop water) level, and how many times to clean it — on a legacy device's
    current map. The settings are stored on the map (customRooms), so scheduled
    and auto cleans of that room use them too. Each room's current values are
    shown as the "room_settings" attribute of the "Clean Room" select entity.
    Only the fields you pass are changed; the others keep their current value.
    Legacy (Tuya-cloud) models only — on X-series vacuums pass per-room
    parameters with a room_clean send_command instead.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    room:
      name: Room
      description: >-
        The room to configure: its name (as in the "Clean Room" select, e.g.
        "Living Room"), the select's option ("Living Room (ID: 3)") or its
        numeric room id.
      required: true
      example: Living Room
      selector:
        text:
    suction:
      name: Suction
      description: Suction power for this room.
      required: false
      example: Max
      selector:
        select:
          options:
            - Quiet
            - Standard
            - Turbo
            - Max
    wash:
      name: Wash level
      description: Mop water level for this room.
      required: false
      example: Mid
      selector:
        select:
          options:
            - Low
            - Mid
            - High
    clean_times:
      name: Clean times
      description: How many times to clean this room (repeat count).
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 3
          mode: box

set_schedule:
  name: Set cleaning schedule
  description: >-
    Add a new cleaning schedule or modify an existing schedule on this vacuum.
    When modifying, every field left out keeps its current value. A new schedule
    needs a time; the other fields default to every day, enabled, Standard
    suction, Mid wash, the whole home, one pass and the general mode.
    Supported on legacy (Tuya Cloud) and scalar (DPS 151) models. Scalar models
    store only time, days, enabled, suction and the path pattern; setting wash,
    rooms or clean times fails there.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    time:
      name: Time
      description: >-
        Cleaning start time in 24-hour HH:MM format (e.g. "08:30" or "14:00").
        Required for a new schedule.
      required: false
      example: "08:30"
      selector:
        time:
    schedule_id:
      name: Schedule ID
      description: >-
        ID or label of an existing schedule to modify. Leave empty to modify the schedule currently selected
        in the 'Selected Schedule' dropdown entity (select.<device>_selected_schedule), or to create a new one.
      required: false
      example: 123456789
      selector:
        text:
    days:
      name: Days of the week
      description: >-
        Days to repeat cleaning. Select one or more days from the dropdown, or enter custom weekdays.
      required: false
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - label: "Every day"
              value: "Every day"
            - label: "Weekdays (Mon - Fri)"
              value: "Mon, Tue, Wed, Thu, Fri"
            - label: "Weekends (Sat - Sun)"
              value: "Sat, Sun"
            - label: "Monday"
              value: "Mon"
            - label: "Tuesday"
              value: "Tue"
            - label: "Wednesday"
              value: "Wed"
            - label: "Thursday"
              value: "Thu"
            - label: "Friday"
              value: "Fri"
            - label: "Saturday"
              value: "Sat"
            - label: "Sunday"
              value: "Sun"
    enabled:
      name: Enabled
      description: Whether this schedule is active.
      required: false
      selector:
        boolean:
    suction:
      name: Suction power
      description: Suction level for the scheduled clean.
      required: false
      example: Max
      selector:
        select:
          options:
            - Quiet
            - Standard
            - Turbo
            - Max
    wash:
      name: Wash level (Mop water)
      description: Mop water flow level for the scheduled clean (mop-capable legacy models; not supported on scalar models).
      required: false
      example: Mid
      selector:
        select:
          options:
            - Low
            - Mid
            - High
            - Dry
    rooms:
      name: Rooms
      description: >-
        Room names or room IDs to clean on schedule; an empty list cleans the whole
        home. Not supported on scalar models.
      required: false
      example: ["Living Room", "Kitchen"]
      selector:
        object:
    clean_times:
      name: Clean times
      description: Number of cleaning cycles per scheduled run (1 to 3). Not supported on scalar models.
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    mode:
      name: Cleaning mode
      description: >-
        Legacy models: general (the schedule's suction and wash) or customize (each
        room's own settings). Scalar models: the path pattern, Arranged or Random;
        general means Arranged.
      required: false
      example: general
      selector:
        select:
          options:
            - label: "General"
              value: "general"
            - label: "Per-room settings (legacy)"
              value: "customize"
            - label: "Arranged (scalar)"
              value: "Arranged"
            - label: "Random (scalar)"
              value: "Random"

delete_schedule:
  name: Delete cleaning schedule
  description: >-
    Delete an existing cleaning schedule by its schedule ID or by picking it from the
    'Selected Schedule' dropdown entity (select.<device>_selected_schedule).
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    schedule_id:
      name: Schedule ID
      description: >-
        The ID or label of the schedule to delete. If omitted, deletes the schedule
        currently selected in the 'Selected Schedule' dropdown entity.
      required: false
      example: 123456789
      selector:
        text:

enable_schedule:
  name: Enable / disable cleaning schedule
  description: >-
    Turn an existing cleaning schedule on or off without deleting it. Can target a specific ID
    or the schedule currently chosen in the 'Selected Schedule' dropdown entity (select.<device>_selected_schedule).
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    enabled:
      name: Enabled
      description: Whether the schedule should be active (true) or inactive (false).
      required: true
      default: true
      selector:
        boolean:
    schedule_id:
      name: Schedule ID
      description: >-
        The ID or label of the schedule to enable or disable. If omitted, updates the schedule
        currently selected in the 'Selected Schedule' dropdown entity.
      required: false
      example: 123456789
      selector:
        text:
