room_at_point:
  name: Room at point
  description: >-
    Resolve which mapped room sits under a normalized point on the rendered map
    image. Returns { room_id, room_name } — room_id 0 means no room there. Used by
    the bundled Eufy Clean card for tap-a-room-on-the-map selection.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    x:
      name: X
      description: Horizontal position as a fraction (0-1) of the rendered map image, from the left edge.
      required: true
      example: 0.42
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box
    y:
      name: Y
      description: Vertical position as a fraction (0-1) of the rendered map image, from the top edge.
      required: true
      example: 0.61
      selector:
        number:
          min: 0
          max: 1
          step: any
          mode: box

map_load:
  name: Load map
  description: >-
    Switch the active map to another saved multi-map by its cloud map id (novel /
    protobuf devices only; scalar and legacy models have no multi-map). The map and
    its room list switch over immediately. For most uses the "Switch Map" select
    entity is easier — it lists the maps the robot has visited and calls this
    service for you; this raw service is for scripts/automations that know the id.

    NOTE: the robot pose does NOT switch automatically. After loading a map the
    robot's position / coordinate frame stays on the previous map until the vacuum
    RE-LOCALIZES, which only happens once it MOVES. To ground the new map right away,
    follow this with a small movement — the most reliable is a single-room clean
    (vacuum only, quiet, one pass), started from a script/automation or by picking a
    room from the list in the Eufy Clean card. Avoid selecting the room by tapping it
    on the map right after a switch: the coordinate frame hasn't re-grounded yet, so
    map taps (and zone drawing) can resolve to the wrong spot. Once the robot moves
    and re-localizes, the reported position snaps onto the loaded map.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    cloud_mapid:
      name: Cloud map id
      description: >-
        The saved map's id, as reported by the device. The easiest way to find it:
        the "Switch Map" select entity lists each visited map as "Map (ID: <id>)"
        (with the friendly name once seen) — flip each map once in the Eufy app so
        the robot reports it, then read the ids there.
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box
    seq:
      name: Sequence
      description: Optional request sequence number the device echoes back in its acknowledgement. Leave as the default unless you need to correlate the ack.
      required: false
      default: 1
      example: 1
      selector:
        number:
          min: 0
          mode: box

forget_map:
  name: Forget map
  description: >-
    Remove a saved map from the "Switch Map" list. The list is learn-as-seen — the
    integration remembers every map the robot has reported and never drops one, because
    the device gives no authoritative list of its current maps to reconcile against. So
    a map deleted in the app, or wiped by a factory reset, keeps showing in the selector
    forever. Use this to prune it. Local only: nothing is sent to the robot, and the
    map on the device is untouched. The ACTIVE map cannot be forgotten (it would
    immediately re-appear); forgetting an id that isn't in the list does nothing.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    cloud_mapid:
      name: Cloud map id
      description: >-
        The id of the saved map to forget, as shown in the "Switch Map" select entity
        ("Map (ID: <id>)").
      required: true
      example: 7
      selector:
        number:
          min: 1
          mode: box

get_schedules:
  name: Get schedules
  description: >-
    Query the robot's cleaning schedules (timers). Returns the full list with
    each schedule's id, enabled state, time, weekdays, type (auto/rooms) and —
    for room schedules — the map id and room ids. Novel/protobuf devices only.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt

add_schedule:
  name: Add schedule
  description: >-
    Create a cleaning schedule on the robot. The robot assigns the new
    schedule's id; the response contains the updated schedule list. Times are
    the robot's local wall-clock time. Novel/protobuf devices only.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    time:
      name: Time
      description: Start time, 24h "HH:MM" (robot-local wall clock).
      required: true
      example: "09:30"
      selector:
        time:
    days:
      name: Days
      description: >-
        Weekdays to repeat on. Leave empty for a one-shot schedule that runs
        once at the next occurrence of the time.
      required: false
      example: '["sun", "mon", "tue"]'
      selector:
        select:
          multiple: true
          options: ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]
    clean_type:
      name: Clean type
      description: Whole-house auto clean, or specific rooms.
      required: false
      default: auto
      selector:
        select:
          options: ["auto", "rooms"]
    room_ids:
      name: Room IDs
      description: Rooms to clean (required when clean_type is "rooms").
      required: false
      example: "[0, 6]"
      selector:
        object:
    map_id:
      name: Map ID
      description: >-
        Map the room ids belong to. Defaults to the device's resolved map id
        (the "Map ID override" option, when set).
      required: false
      selector:
        number:
          min: 1
          mode: box
    enabled:
      name: Enabled
      description: Whether the schedule starts out enabled.
      required: false
      default: true
      selector:
        boolean:

update_schedule:
  name: Update schedule
  description: >-
    Modify an existing schedule. Only the provided fields change; everything
    else — including cleaning parameters set from the Eufy app — is preserved
    (the device requires the full schedule on every modify, so the last
    device-reported copy is used as the base). Novel/protobuf devices only.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    schedule_id:
      name: Schedule ID
      description: The schedule's id, as reported by get_schedules.
      required: true
      selector:
        number:
          min: 0
          mode: box
    time:
      name: Time
      description: New start time, 24h "HH:MM".
      required: false
      selector:
        time:
    days:
      name: Days
      description: New weekday set; an empty list makes it one-shot.
      required: false
      selector:
        select:
          multiple: true
          options: ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]
    room_ids:
      name: Room IDs
      description: New room list (rooms-type schedules only).
      required: false
      selector:
        object:
    map_id:
      name: Map ID
      description: New map id (rooms-type schedules only).
      required: false
      selector:
        number:
          min: 1
          mode: box

delete_schedule:
  name: Delete schedule
  description: Delete a schedule by id. Novel/protobuf devices only.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    schedule_id:
      name: Schedule ID
      description: The schedule's id, as reported by get_schedules.
      required: true
      selector:
        number:
          min: 0
          mode: box

set_schedule_enabled:
  name: Enable/disable schedule
  description: Turn a schedule on or off without deleting it. Novel/protobuf devices only.
  target:
    entity:
      domain: vacuum
      integration: robovac_mqtt
  fields:
    schedule_id:
      name: Schedule ID
      description: The schedule's id, as reported by get_schedules.
      required: true
      selector:
        number:
          min: 0
          mode: box
    enabled:
      name: Enabled
      description: true to enable, false to disable.
      required: true
      selector:
        boolean:
