name: Frontend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run card and renderer suites
        run: npm test
